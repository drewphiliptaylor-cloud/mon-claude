<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26282c"/><stop offset="1" stop-color="#121315"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.5"><stop offset="0" stop-color="#e5a00d" stop-opacity=".34"/><stop offset="1" stop-color="#e5a00d" stop-opacity="0"/></radialGradient>
    <radialGradient id="disque" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#4a3410"/><stop offset=".75" stop-color="#1b1c1f"/></radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e5a00d" stop-opacity="0"/><stop offset=".55" stop-color="#e5a00d"/><stop offset="1" stop-color="#ffe3a0"/></linearGradient>
    <radialGradient id="coeur" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff4d6"/><stop offset=".45" stop-color="#f6c75a"/><stop offset="1" stop-color="#e5a00d" stop-opacity="0"/></radialGradient>
    <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#fond)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#halo)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="4"/>
  <circle cx="512" cy="512" r="300" fill="url(#disque)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="6"/>
  <!-- traînée lumineuse à 45° : l'orbe qui « réfléchit » -->
  <circle cx="512" cy="512" r="338" fill="none" stroke="url(#arc)" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="760 2200" transform="rotate(-200 512 512)" filter="url(#flou)" opacity=".7"/>
  <circle cx="512" cy="512" r="338" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round"
          stroke-dasharray="760 2200" transform="rotate(-200 512 512)"/>
  <circle cx="512" cy="512" r="150" fill="url(#coeur)" filter="url(#flou)"/>
  <circle cx="512" cy="512" r="78" fill="#ffd77a"/>
  <circle cx="490" cy="488" r="26" fill="#fff" opacity=".55"/>
